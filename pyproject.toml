[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anypii-flash"
version = "0.1.0"
description = "Schema-driven PII redaction with GLiNER2.5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
model = [
    "gliner2[local]>=2.1,<3",
    "huggingface_hub>=0.24",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
anypii-flash = "anypii_flash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
